name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: tests (${{ matrix.os }}, ${{ matrix.compiler }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, compiler: g++ }
          - { os: ubuntu-latest, compiler: clang++ }
          - { os: macos-latest, compiler: clang++ }
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_CXX_COMPILER=${{ matrix.compiler }}
      - name: Build
        run: cmake --build build --parallel
      - name: Test
        run: ctest --test-dir build --output-on-failure

  # The one that matters: a missing acquire/release shows up here and nowhere
  # else, because the single-threaded tests would still pass without it.
  thread-sanitizer:
    name: ThreadSanitizer
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure with TSan
        run: cmake -B build-tsan -DSPSC_TSAN=ON -DSPSC_BUILD_BENCH=OFF -DCMAKE_CXX_COMPILER=clang++
      - name: Build
        run: cmake --build build-tsan --parallel
      - name: Run under TSan
        run: ./build-tsan/spsc_tests
        env:
          TSAN_OPTIONS: halt_on_error=1

  benchmark:
    name: benchmark (informational)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release -DSPSC_BUILD_TESTS=OFF
      - name: Build
        run: cmake --build build --parallel
      # CI runners are shared and noisy, so these numbers are a smoke test that
      # the harness still runs. The README's figures come from a quiet machine.
      - name: Run
        run: ./build/spsc_bench
